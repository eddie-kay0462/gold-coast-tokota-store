; On top of php.ini-production.

; Image uploads: nginx allows 12M (docker/nginx.conf).
upload_max_filesize = 12M
post_max_size = 13M

expose_php = Off

; The code never changes inside a running container; a deploy is a new image.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
