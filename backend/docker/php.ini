; On top of php.ini-production.

; Image uploads: nginx allows 16M (docker/nginx.conf); product photos are
; up to 15 MB.
upload_max_filesize = 16M
post_max_size = 17M

expose_php = Off

; The code never changes inside a running container; a deploy is a new image.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
