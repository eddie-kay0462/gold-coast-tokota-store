# Behind the shared box's Caddy (docs/deploy/contabo.md), which terminates TLS
# and compresses. No real_ip handling here: Caddy's X-Forwarded-For/-Proto
# reach Laravel untouched, and TRUSTED_PROXIES tells it to believe them.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 12M;   # image uploads
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known) { deny all; }
}
