# Behind the shared box's Caddy (docs/deploy/contabo.md), which terminates TLS
# and compresses. No real_ip handling here: Caddy's X-Forwarded-For/-Proto
# reach Laravel untouched, and TRUSTED_PROXIES tells it to believe them.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 16M;   # product photos are up to 15 MB (StoreProductPhotoRequest)
    server_tokens off;

    # Look `app` up through Docker's DNS on every request, not once at start.
    # A deploy that rebuilds only `app` gives it a new address; with a fixed
    # `fastcgi_pass app:9000` the old `web` kept calling the old one (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known) { deny all; }
}
